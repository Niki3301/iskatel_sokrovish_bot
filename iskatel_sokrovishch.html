<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Искатель сокровищ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#07130f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;justify-content:center;padding:10px;background:radial-gradient(circle at 50% -10%,#284f36,#07130f 55%)}
.game{width:min(100%,520px)}
h1{text-align:center;margin:4px 0 0;font-size:30px;text-shadow:0 3px 12px #000}
.sub{text-align:center;color:#a9c3ad;font-size:13px;margin:0 0 11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.stat{background:linear-gradient(145deg,#193323,#10241a);border:1px solid #365c40;border-radius:13px;padding:7px;text-align:center;box-shadow:0 5px 16px #0006}
.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:#94ae9a}
.map{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#0c1d14;padding:7px;border:2px solid #426449;border-radius:18px;box-shadow:0 12px 30px #0009,inset 0 0 20px #0006}
.cell{position:relative;aspect-ratio:1;border:1px solid #395a3f;border-radius:9px;background:linear-gradient(145deg,#315c38,#23462d);color:#b8d1b8;font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 -4px 0 #183522;transition:.14s transform,.14s filter,.2s background}
.cell:active{transform:scale(.90)}
.cell:hover{filter:brightness(1.12)}
.cell.open{background:linear-gradient(145deg,#4b7345,#315837);box-shadow:inset 0 -2px 0 #29492e}
.cell.treasure{background:linear-gradient(145deg,#b67b20,#68420e);animation:glow 1.2s infinite alternate}
.cell.trap{background:linear-gradient(145deg,#873838,#4b2027)}
.cell.player{z-index:2;background:radial-gradient(circle,#7bb56e,#315b36);font-size:27px;animation:bob .65s infinite alternate}
.cell.fog{color:#617966}
.controls{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center;margin:12px 0}
button.ctrl,.restart{border:1px solid #48644d;border-radius:13px;background:linear-gradient(145deg,#294634,#172b20);color:#fff;font-size:23px;height:52px;font-weight:700;box-shadow:0 5px 12px #0006}
button.ctrl:active,.restart:active{transform:scale(.94)}
.empty{visibility:hidden}
.restart{display:block;width:100%;height:46px;font-size:15px;background:linear-gradient(145deg,#5d793c,#354e29)}
.message{text-align:center;min-height:42px;color:#d7e7d9;font-size:14px;padding:3px 10px}
.help{text-align:center;color:#78927e;font-size:11px;margin-top:8px}
@keyframes glow{from{filter:brightness(.9)}to{filter:brightness(1.35);transform:translateY(-1px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
.cell.new{animation:pop .35s ease-out}
</style>
</head>
<body>
<div class="game">
<h1>🗺️ Искатель сокровищ</h1>
<div class="sub">Найди все сокровища и не попади в ловушки</div>

<div class="stats">
<div class="stat"><b id="coins">0</b><span>МОНЕТЫ</span></div>
<div class="stat"><b id="found">0/5</b><span>СОКРОВИЩА</span></div>
<div class="stat"><b id="lives">❤️❤️❤️</b><span>ЖИЗНИ</span></div>
<div class="stat"><b id="moves">0</b><span>ХОДЫ</span></div>
</div>

<div id="map" class="map"></div>
<div id="message" class="message">Выбери соседнюю клетку или используй кнопки.</div>

<div class="controls">
<div class="empty"></div><button class="ctrl" onclick="move(0,-1)">⬆️</button><div class="empty"></div>
<button class="ctrl" onclick="move(-1,0)">⬅️</button><button class="ctrl" onclick="move(0,1)">⬇️</button><button class="ctrl" onclick="move(1,0)">➡️</button>
</div>

<button class="restart" onclick="newGame()">🔄 Новая экспедиция</button>
<div class="help">💡 Сокровища дают монеты. Ловушка отнимает жизнь. Удачной охоты!</div>
</div>

<script>
const W=8,H=8,TREASURES=5,TRAPS=7;
let player,treasures,traps,opened,coins,lives,moves,ended;

function key(x,y){return y*W+x}
function randomFree(used){
  let p;
  do {p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}} while(used.has(key(p.x,p.y)));
  used.add(key(p.x,p.y)); return p;
}
function newGame(){
  player={x:0,y:0}; treasures=[]; traps=[]; opened=new Set([key(0,0)]);
  coins=0;lives=3;moves=0;ended=false;
  const used=new Set([key(0,0)]);
  for(let i=0;i<TREASURES;i++) treasures.push(randomFree(used));
  for(let i=0;i<TRAPS;i++) traps.push(randomFree(used));
  render(); msg("Экспедиция началась! Ищи золото 🪙");
}
function at(arr,x,y){return arr.findIndex(p=>p.x===x&&p.y===y)}
function move(dx,dy){
  if(ended)return;
  const nx=player.x+dx,ny=player.y+dy;
  if(nx<0||nx>=W||ny<0||ny>=H){msg("⛔ Дальше дороги нет.");return}
  player={x:nx,y:ny};moves++;opened.add(key(nx,ny));
  const ti=at(treasures,nx,ny);
  const ri=at(traps,nx,ny);
  if(ti>=0){
    coins+=20+Math.floor(Math.random()*31);
    treasures.splice(ti,1);
    msg("💰 Сокровище найдено! +монеты");
  }else if(ri>=0){
    lives--;traps.splice(ri,1);
    msg(lives?"💀 Ловушка! Ты потерял жизнь.":"💀 Последняя жизнь потеряна!");
    if(!lives){ended=true;msg("☠️ Экспедиция окончена. Нажми «Новая экспедиция».")}
  }else{
    const nearby=treasures.filter(t=>Math.abs(t.x-nx)+Math.abs(t.y-ny)<=2).length;
    msg(nearby?"🔎 Кажется, сокровище где-то рядом...":"🌲 Здесь пока ничего.");
  }
  if(treasures.length===0 && lives>0){
    ended=true;coins+=100;msg("🏆 ТЫ НАШЁЛ ВСЕ СОКРОВИЩА! +100 бонусных монет!");
  }
  render();
}
function render(){
  document.getElementById("coins").textContent=coins;
  document.getElementById("found").textContent=(TREASURES-treasures.length)+"/"+TREASURES;
  document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
  document.getElementById("moves").textContent=moves;
  const map=document.getElementById("map");map.innerHTML="";
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const b=document.createElement("button");b.className="cell";
    const k=key(x,y);
    if(x===player.x&&y===player.y){b.textContent="🧭";b.classList.add("open","player")}
    else if(opened.has(k)){
      b.classList.add("open");
      if(at(treasures,x,y)>=0){b.textContent="💰";b.classList.add("treasure","new")}
      else if(at(traps,x,y)>=0){b.textContent="💀";b.classList.add("trap","new")}
      else b.textContent=["🌿","🍃","🪨","🌱"][((x*7+y*3)%4)];
    }else {b.textContent="🌫️";b.classList.add("fog")}
    b.onclick=()=>cellClick(x,y);
    map.appendChild(b);
  }
}
function cellClick(x,y){
  const dx=x-player.x,dy=y-player.y;
  if(Math.abs(dx)+Math.abs(dy)!==1){msg("👣 Можно перейти только на соседнюю клетку.");return}
  move(dx,dy);
}
function msg(t){document.getElementById("message").textContent=t}
document.addEventListener("keydown",e=>{
  const m={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];
  if(m){e.preventDefault();move(...m)}
});
newGame();
</script>
</body>
</html>
